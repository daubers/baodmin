name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: pkgs.daubney.dev
  IMAGE: pkgs.daubney.dev/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      openbao:
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  image:
    needs: [check, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the container registry
        run: echo "${{ secrets.PKGS_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.PKGS_USER }}" --password-stdin
      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
